<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIAF · Digital Arts Festival</title>
<meta name="description" content="서울예술대학교 디지털아트전공 디지털아트 페스티벌(DIAF)의 연도별 기록.">
<script>if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro', 'lock');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ── Claude Design 'Cascades' (DIAF) — Blend 테마 토큰.
   본문 서체 Haas Unica SH 는 라이선스가 없어(wembi 소유) 디자인 시스템 대체안대로 Archivo 로 씁니다.
   바탕은 사용자 요청으로 모래색 대신 밝은 흰색 톤 (2026-09-30). ── */
:root{
  /* 색 공식 (2026-10-01): 클래식 60·30·10 + 요즘 방식(한 색의 명도 단계 + 형광 포인트 하나).
     60 흰 바탕·검정 글자 / 30 연파랑(슬레이트) 단계 / 10 형광 라임. 빨강·라일락은 쓰지 않는다. */
  --paper:#fff;--ink:#000;--white:#fff;
  --slate-50:#eef3f5;--slate-100:#dde8ec;--slate-200:#c4d7de;--slate:#9dbbc5;--slate-deep:#3b6370;
  --lime:#beff8b;
  --paper-2:var(--slate-50);--ph:var(--slate-100);--rule-soft:#d3dfe3;--fg-2:#4f5d62;
  --font-display:'Archivo','Noto Sans KR',system-ui,sans-serif;
  --font-text:'Archivo','Noto Sans KR',system-ui,sans-serif;
  --r-control:10px 10px 0 0;--r-card:14px;--r-chip:30px;--r-sm:6px;
  --ease-reveal:cubic-bezier(.19,1,.22,1);--ease-ui:cubic-bezier(.5,0,0,1);--dur-ui:.3s;
  --g:25px;--hh:60px;--sec:87.5px;
}
@media (max-width:768px){:root{--g:16px;--sec:60px}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;scroll-padding-top:var(--hh)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-text);font-stretch:100%;font-weight:400;font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none;transition:color var(--dur-ui) var(--ease-ui)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--lime);color:var(--ink)}
:focus-visible{outline:2px solid var(--slate-deep);outline-offset:3px}
p{margin:0}
.display{font-family:var(--font-display);font-stretch:125%;font-weight:800;line-height:.86;letter-spacing:-.02em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.ko{font-family:'Noto Sans KR',sans-serif;font-stretch:100%;font-weight:900;letter-spacing:-.04em}
.caps{font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.skip{position:fixed;left:var(--g);top:-60px;z-index:60;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r-sm)}
.skip:focus{top:10px}

/* ── 헤더: 왼쪽 메뉴 + 가운데 로고 + 오른쪽 버튼 (sakazuki 배치) ── */
.hdr{position:fixed;inset:0 0 auto;z-index:40;height:var(--hh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--g);padding:0 var(--g);background:var(--paper);color:var(--ink);border-bottom:1px solid var(--ink);transition:background-color var(--dur-ui) var(--ease-ui),color var(--dur-ui) var(--ease-ui),border-color var(--dur-ui) var(--ease-ui)}
.nav{display:flex;gap:30px}
.mark{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1}
.side{display:flex;gap:20px;align-items:center;justify-content:flex-end}
.roll{position:relative;display:inline-block;overflow:hidden;height:1.4em;font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.roll span{display:block;transition:transform .4s var(--ease-reveal)}
.roll span+span{position:absolute;left:0;top:100%;color:var(--slate-deep)}
.roll:hover span,.roll.is-on span{transform:translateY(-100%)}
.paren:hover{color:var(--slate-deep)}
.menu-btn{display:none}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 25px;border:1px solid var(--ink);border-radius:var(--r-control);background:var(--ink);color:var(--paper);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1;white-space:nowrap;transition:background-color var(--dur-ui) var(--ease-ui),color var(--dur-ui) var(--ease-ui),border-color var(--dur-ui) var(--ease-ui)}
.btn:hover{background:var(--lime);color:var(--ink)}
.btn i{font-style:normal;transition:transform .2s ease-in-out}
.btn:hover i{transform:translateX(3px)}
.btn.sm{padding:8.75px 16px;font-size:12px}

/* 휴대폰 메뉴 (네이티브 dialog: 포커스 가둠·ESC 닫기) */
.menu{width:100%;max-width:none;height:100%;max-height:none;margin:0;border:0;padding:0 var(--g) var(--g);background:var(--paper);color:var(--ink)}
.menu::backdrop{background:rgba(0,0,0,.72)}
.menu[open]{display:flex;flex-direction:column}
.menu-top{min-height:var(--hh);padding:16px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule-soft)}
.menu-nav{display:flex;flex-direction:column;margin-top:40px}
.menu-nav a{font-size:clamp(44px,14vw,96px);padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.menu-foot{margin-top:auto;display:flex;justify-content:space-between}

/* ── 화면 아래 고정 표시: 지금 구역(wembi 칩) + 서울 시각(sakazuki 시계) ── */
.hud{position:fixed;left:var(--g);right:var(--g);bottom:var(--g);z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;pointer-events:none;transition:opacity var(--dur-ui) var(--ease-ui)}
.hud.off{opacity:0}
.chip{justify-self:start;background:var(--lime);color:var(--ink);border-radius:var(--r-chip);padding:5px 12px}
.clock{color:var(--white);mix-blend-mode:difference;font-variant-numeric:tabular-nums}

/* ── 공통 구역 ── */
.sec{padding:var(--sec) var(--g)}
.inv{background:var(--paper-2)}
.sh{border-top:1px solid currentColor;padding-top:10px}
.sh .meta{display:flex;justify-content:space-between}
.sh h2{font-size:clamp(44px,10.4vw,200px);margin:25px 0 50px}
.ln{display:block;overflow:hidden;padding-bottom:.04em}
.ln>span{display:inline-block;transform:translateY(105%)}
.sh.in .ln>span{animation:lineUp 1s var(--ease-reveal) forwards}
@keyframes lineUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
.lead{font-size:clamp(18px,1.7vw,25px);line-height:1.5;font-weight:500;max-width:36em}
.muted{color:var(--fg-2)}
.tbd{background:var(--slate-100);padding:2px 8px;border-radius:var(--r-sm)}

/* ── 첫 화면 (era 의 창이 스크롤을 따라 전면으로 커지는 인트로 + 가운데 쪼갠 워드마크) ── */
.hero{position:relative;height:240vh;background:var(--paper)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.panel{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:var(--g);padding:calc(var(--hh) + var(--g)) var(--g) calc(var(--g) + 50px);color:var(--ink);clip-path:inset(30vh 36vw 30vh 36vw round 14px);will-change:clip-path}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.p-top{display:flex;justify-content:space-between;border-top:1px solid var(--ink);padding-top:10px}
.p-theme{align-self:center;font-size:clamp(40px,10.4vw,200px)}
.p-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--g)}
.p-bot p{max-width:32em;font-weight:500}
.pin{opacity:0}
.word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;will-change:opacity}
.split{display:flex;justify-content:center;font-size:clamp(56px,22vw,422px);white-space:nowrap}
.fade{pointer-events:none}
.spread{position:absolute;left:var(--g);right:var(--g);top:50%;display:flex;justify-content:space-between;transform:translateY(-50%)}
.cue{position:absolute;left:50%;bottom:var(--g);transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.cue i{display:block;width:1px;height:48px;background:currentColor;transform-origin:top;animation:cue 2.4s var(--ease-reveal) infinite}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.ring{position:absolute;right:var(--g);bottom:calc(var(--g) + 40px);width:112px;height:112px;animation:spin 25s linear infinite}
.ring text{fill:currentColor;font:500 7px var(--font-text);letter-spacing:.08em}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 01 소개: 스크롤하면 글자가 차례로 진해진다 (wembi) + 숫자 3칸 ── */
.stmt-wrap{display:grid;grid-template-columns:1fr 3fr;gap:var(--g)}
.stmt{font-size:clamp(26px,3.3vw,56px);line-height:1.2;font-weight:500;letter-spacing:-.02em;word-break:keep-all}
.w{color:rgba(0,0,0,.16);transition:color var(--dur-ui) var(--ease-ui)}
.w.on{color:var(--ink)}
mark{background:var(--lime);color:inherit;border-radius:var(--r-sm);padding:0 .12em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g);margin-top:var(--sec)}
.stats>div{border-top:1px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:16px}
.stats b{font-size:clamp(56px,7.8vw,150px)}
.stats small{font-size:.4em;letter-spacing:0}

/* ── 02 역대 페스티벌: 연도를 잇는 선(era 지도 선) + 목록과 따라오는 미리보기(wembi) ── */
.tl-wrap{overflow-x:auto;margin:0 calc(var(--g) * -1) var(--sec);padding:0 var(--g);scrollbar-width:none}
.tl{position:relative;height:210px;min-width:760px}
.tl svg{position:absolute;left:0;top:100px;width:100%;height:100px;overflow:visible}
.tl path{fill:none;stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2s var(--ease-reveal)}
.tl.in path{stroke-dashoffset:0}
.pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink);font-style:normal;opacity:0;transition:opacity .6s ease,transform .6s var(--ease-reveal);transition-delay:calc(var(--i) * 130ms + .5s);transform:scale(.4)}
.pt.hollow{background:var(--paper);border:1px solid var(--ink)}
.tl.in .pt{opacity:1;transform:none}
.pt span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:170px;text-align:center;display:flex;flex-direction:column;gap:4px}
.pt em{font-style:normal}
.pt b{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:25px;line-height:1;letter-spacing:-.01em}
a.pt:hover b{color:var(--slate-deep)}
.ed{display:grid;grid-template-columns:5fr 7fr;gap:var(--g);align-items:start}
.ed-prev{position:sticky;top:calc(var(--hh) + var(--g));aspect-ratio:4/5;border-radius:var(--r-card);overflow:hidden}
.pv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:var(--g);opacity:0;transition:opacity .45s ease}
.pv.on{opacity:1}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.pv .display{font-size:clamp(40px,5.2vw,100px)}
.erow{display:grid;grid-template-columns:70px 1fr auto;gap:10px var(--g);align-items:baseline;border-top:1px solid var(--ink);padding:20px 0 30px}
.erow:last-child{border-bottom:1px solid var(--ink)}
.erow .t{font-size:clamp(30px,4vw,63px)}
.erow .t span{border-radius:var(--r-sm);padding:0 .06em;transition:background-color var(--dur-ui) var(--ease-ui)}
.erow:hover .t span,.erow:focus-visible .t span{background:var(--c)}
.erow .m{grid-column:2;color:var(--fg-2);max-width:40em}
.erow .go{grid-row:1;grid-column:3;transition:transform .2s ease-in-out}
.erow:hover .go{transform:translateX(3px);color:var(--slate-deep)}

/* 테마 흐름 띠 (sakazuki 이름 띠, 빨강/흰 조합) */
.mq{background:var(--ink);color:var(--lime);overflow:hidden;padding:18px 0}
.mq .track{display:flex;width:max-content;animation:mq 25s linear infinite}
.mq .run{display:flex;align-items:center}
.mq b{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:clamp(48px,7vw,113px);line-height:1;text-transform:uppercase;letter-spacing:-.02em;white-space:nowrap}
.mq b.ko{font-family:'Noto Sans KR',sans-serif;font-weight:900}
.mq s{text-decoration:none;font-size:clamp(20px,2.4vw,40px);margin:0 .9em}
@keyframes mq{to{transform:translateX(-50%)}}

/* ── 03 진행 방식: 가운데 정렬 큰 단어 목록 (wembi), 올리면 라임 칸 ── */
.fmt{list-style:none;margin:0;padding:0}
.fmt li{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--g);padding:22px 20px;border-top:1px solid var(--ink);border-radius:var(--r-control);transition:background-color var(--dur-ui) var(--ease-ui),color var(--dur-ui) var(--ease-ui)}
.fmt li:last-child{border-bottom:1px solid var(--ink)}
.fmt li:hover{background:var(--lime);color:var(--ink)}
.fmt li:hover .muted{color:var(--ink)}
.fmt h3{font-size:clamp(32px,6vw,113px);text-align:center}
.fmt p{justify-self:end;max-width:26em;text-align:right}

/* ── 04 FAQ (sakazuki 질문 목록, 네이티브 details) ── */
.faq-wrap{display:grid;grid-template-columns:1fr 2fr;gap:var(--g)}
.faq details{border-top:1px solid var(--ink)}
.faq details:last-child{border-bottom:1px solid var(--ink)}
.faq summary{list-style:none;display:grid;grid-template-columns:110px 1fr 24px;gap:var(--g);align-items:baseline;padding:22px 0;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq .q{font-size:clamp(20px,1.8vw,28px);font-weight:500;line-height:1.3}
.faq summary i{font-style:normal;font-size:22px;line-height:1;transition:transform var(--dur-ui) var(--ease-ui)}
.faq details[open] summary i{transform:rotate(45deg);color:var(--slate-deep)}
.faq summary:hover .q{color:var(--slate-deep)}
.faq details p{margin:0 0 28px calc(110px + var(--g));max-width:38em;color:var(--fg-2)}

/* ── 연락 블록 (wembi Mail/Phone: 라임 탭 + 라일락 알약) ── */
.cta{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.blk{display:inline-flex;align-items:center;gap:.3em;max-width:100%;font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:clamp(28px,8vw,150px);line-height:1;text-transform:uppercase;letter-spacing:-.02em;padding:.12em .35em .1em;transition:background-color var(--dur-ui) var(--ease-ui),color var(--dur-ui) var(--ease-ui)}
.blk.lime{background:var(--lime);border-radius:var(--r-control)}
.blk.slate{background:var(--slate);border-radius:100px;padding-inline:.5em}
.blk:hover{background:var(--ink);color:var(--paper)}
.blk i{font-style:normal;font-size:.6em}

/* ── 연도 페이지 ── */
.ehero{background:var(--paper-2);padding:calc(var(--hh) + var(--g)) var(--g) var(--sec);display:flex;flex-direction:column;gap:var(--sec)}
.e3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);padding-top:10px}
.e3>:nth-child(2){text-align:center}.e3>:nth-child(3){text-align:right}
.e3 a:hover{color:var(--slate-deep)}
.ebody{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--g)}
.eyear{font-size:clamp(96px,21vw,400px);flex:none}
.ebot{max-width:360px;display:flex;flex-direction:column;gap:16px}
.etheme{font-size:clamp(32px,3.9vw,75px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);align-items:start}
.kv{aspect-ratio:4/5;border-radius:var(--r-card);overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:var(--g)}
.kv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kv .display{font-size:clamp(40px,5.2vw,100px)}
.spec{margin:40px 0 0}
.spec div{display:grid;grid-template-columns:110px 1fr;gap:var(--g);border-top:1px solid var(--ink);padding:14px 0}
.spec div:last-child{border-bottom:1px solid var(--ink)}
.spec dd{margin:0}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:50px var(--g)}
.card{margin:0}
.card .media{aspect-ratio:4/3;background:var(--ph);border-radius:var(--r-card);display:grid;place-items:center;color:var(--fg-2)}
.card figcaption{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;border-top:1px solid var(--ink);margin-top:10px;padding-top:10px}
.card figcaption b{font-size:25px;line-height:1}
.card figcaption .muted{grid-column:2;font-size:13px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);margin-top:var(--sec)}
.pager a{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--ink);padding-top:10px}
.pager a:last-child{text-align:right;align-items:flex-end}
.pager .display{font-size:clamp(56px,7.8vw,150px)}
.pager a:hover .display{color:var(--slate-deep)}

/* ── 푸터: 떨어져 쌓이는 스티커(sakazuki) + 큰 워드마크 ── */
.ftr{background:var(--paper-2);padding:60px var(--g) var(--g)}
.ftr .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g);border-top:1px solid var(--ink);padding-top:10px}
.ftr a:hover{color:var(--slate-deep)}
.pile{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 18px;padding:40px 0;margin-top:10px}
.pile span{padding:.1em .5em;border-radius:var(--r-chip);font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:clamp(20px,3vw,48px);line-height:1.1;text-transform:uppercase;white-space:nowrap;transform:rotate(var(--r));color:var(--ink)}
.pile .lime{background:var(--lime)}.pile .slate{background:var(--slate)}.pile .paper{background:var(--paper);border:1px solid var(--ink)}
.pile .ink{background:var(--ink);color:var(--lime)}
.pile:not(.in) span{visibility:hidden}
.pile.in span{animation:fall .9s cubic-bezier(.55,0,1,.45) both;animation-delay:var(--d)}
@keyframes fall{from{transform:translateY(-260px) rotate(0deg)}to{transform:rotate(var(--r))}}
.ftr .big{font-size:clamp(40px,24vw,420px);line-height:.8;letter-spacing:-.035em;white-space:nowrap;margin-top:10px}
.ftr .bottom{display:flex;justify-content:space-between;gap:var(--g);margin-top:25px;color:var(--fg-2)}

/* ── 입장: 세 줄 글자 안에 액체가 차오른다 (캔버스, anime.js 가 있을 때만) ── */
.loader{display:none}
.intro .loader{position:fixed;inset:0;z-index:70;display:block;background:var(--paper)}
.loader canvas{position:absolute;inset:0;width:100%;height:100%}
.ld-count{position:absolute;left:var(--g);bottom:calc(var(--g) + 4px);font-variant-numeric:tabular-nums}
.ld-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--lime);transform-origin:left;transform:scaleX(0)}
.lock{overflow:hidden}
.lm i{font-style:normal;display:inline-block}
/* anime.js 가 맡는 움직임은 CSS 쪽을 끈다 */
.anim .ln>span{transform:none}
.anim .sh.in .ln>span{animation:none}
.anim .tl path,.anim .pt{transition:none}
.anim .mq .track{animation:none}
.anim .pile span{visibility:visible!important;animation:none!important}
.anim .pv{opacity:1;transition:none}

/* 화면에 들어오면 떠오르는 블록 */
.rv{opacity:0;transform:translateY(24px);transition:transform .6s var(--ease-reveal),opacity .28s ease}
.rv.in{opacity:1;transform:none}

@media (max-width:1024px){
  .ed{grid-template-columns:1fr}.ed-prev{display:none}
  .ebody{flex-direction:column;align-items:flex-start}
  .works{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .hdr{grid-template-columns:auto 1fr}
  .nav,.hdr .btn{display:none}
  .menu-btn{display:inline-block}
  .stmt-wrap,.faq-wrap,.two{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .fmt li{grid-template-columns:1fr;gap:10px;padding:20px 12px}
  .fmt h3{text-align:left}.fmt p{justify-self:start;text-align:left}
  .faq summary{grid-template-columns:1fr 24px;gap:6px 16px}
  .faq summary .caps{grid-column:1/-1}
  .faq details p{margin-left:0}
  .p-bot{flex-direction:column;align-items:flex-start}
  .works{grid-template-columns:1fr}
  .ftr .cols{grid-template-columns:1fr 1fr}
  .ring{display:none}
  .cue{bottom:calc(var(--g) + 44px)}
  .fmt h3{font-size:7.4vw}
  .e3{grid-template-columns:1fr 1fr}.e3>:nth-child(2){display:none}
}
/* 움직임 줄이기: 인트로는 창을 다 연 상태로, 흐르는·떨어지는 움직임은 멈춘다 */
@media (prefers-reduced-motion:reduce){
  .hero{height:auto}.stage{position:relative;height:auto;overflow:visible}
  .word{position:relative;height:100svh}
  .panel{position:relative;min-height:100svh;clip-path:none}.pin{opacity:1}
  .mq .track,.ring,.cue i{animation:none}
  .sh .ln>span,.rv{transform:none;opacity:1;animation:none}
  .tl path{stroke-dashoffset:0;transition:none}.pt{opacity:1;transform:none;transition:none}
  .pile span{visibility:visible!important;animation:none!important}
  .w{color:var(--ink)}
}
</style>
</head>
<body>

<a class="skip" href="#app">본문으로 건너뛰기</a>
<header class="hdr" id="hdr">

    <a class="roll" href="#/format"><span>Format</span><span aria-hidden="true">Format</span></a>
    <a class="roll" href="#/faq"><span>FAQ</span><span aria-hidden="true">FAQ</span></a>
  </nav>
  <a class="mark" href="#/" aria-label="DIAF 처음으로">DIAF</a>
  <div class="side">
    <a class="paren caps" href="https://www.instagram.com/digitalartsfestival_sia/" target="_blank" rel="noopener" aria-label="DIAF 인스타그램">(IG)</a>
    <a class="btn sm" href="#/editions">Archive <i aria-hidden="true">→</i></a>
    <button class="menu-btn caps" type="button" aria-haspopup="dialog" aria-controls="menu">(menu)</button>
  </div>
</header>
<dialog class="menu" id="menu" aria-label="메뉴">
  <div class="menu-top"><span class="mark">DIAF</span><button class="caps" type="button" data-close>( close )</button></div>
  <nav class="menu-nav" aria-label="메뉴">
    <a class="display" href="#/about">About</a>
    <a class="display" href="#/editions">Editions</a>
    <a class="display" href="#/format">Format</a>
    <a class="display" href="#/faq">FAQ</a>
  </nav>
  <div class="menu-foot caps"><a href="https://www.instagram.com/digitalartsfestival_sia/" target="_blank" rel="noopener">(IG)</a><span>Seoul Institute of the Arts</span></div>
</dialog>
<main id="app"></main>
<div class="hud" id="hud" aria-hidden="true"><span class="chip caps" id="chip">DIAF</span><span class="clock caps" id="clock"></span><span></span></div>
<footer class="ftr" id="ftr">
  <div class="cols caps">
    <div>Seoul Institute of the Arts<br>Digital Arts</div>
    <div><a href="https://digitalarts-homepage.vercel.app" target="_blank" rel="noopener">디지털아트전공 홈페이지 ↗</a></div>
    <div><a href="https://www.instagram.com/digitalartsfestival_sia/" target="_blank" rel="noopener">(IG)</a></div>
    <div style="text-align:right"><a href="#top" data-top>( back to top ↑ )</a></div>
  </div>
  <div class="pile" id="pile" data-rv aria-hidden="true"></div>
  <div class="display big" aria-hidden="true">DIAF</div>
  <div class="bottom caps"><span>© Seoul Institute of the Arts, Digital Arts</span><span>Digital Arts Festival</span></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" integrity="sha384-InMmvD3VoYcY7hGjSC80aLb2bNNE4CzpX+Eq6FVDlmB0IKgDvmfPw4UY8L/M++iG" crossorigin="anonymous"></script>
<script>
(function(){
  'use strict';
  /* ── 역대 페스티벌: 한 해를 더하려면 여기에 한 줄 (최신이 위로). 모르는 값은 null → '[자료 필요]'.
     kv 에 대표 이미지 주소를 넣으면 색 블록 대신 이미지가 나온다.
     출처: 2025 천지일보·신아일보·포인트데일리 기사, 2024·2023 서울예대 보도자료 검색 결과 (2026-09-30) */
  var EDITIONS = [
    { year: 2025, theme: 'Re:Spire', ko: false, kv: null, note: '디지털 환경 속 창작자 사이의 유기적 연결과 예술적 영감의 순환을 ‘호흡’에 빗대어 표현한 전시.',
      date: '2025년 6월 20일 – 22일', venue: '서울예술대학교 예술공학센터(아텍)', works: '약 20점', people: '120명 (교수진 8명, 재학생 약 100명)', admission: '무료',
      genres: '인스톨레이션, 게임, 미디어 퍼포먼스, 애니메이션' },
    { year: 2024, theme: '문(門)', ko: true, kv: null, note: '인스톨레이션, 게임, 미디어아트, 애니메이션, 미디어 퍼포먼스 등 여러 장르로 풀어낸 전시.',
      date: null, venue: null, works: '22점', people: null, admission: null, genres: '인스톨레이션, 게임, 미디어아트, 애니메이션, 미디어 퍼포먼스' },
    { year: 2023, theme: 'Multi-Pairing', ko: false, kv: null, note: '두 개 이상의 개체가 서로 연결되어 함께 작동하는 연동 과정을 주제로 한 전시.',
      date: null, venue: null, works: '25점', people: null, admission: null, genres: null }
  ];
  var IG = 'https://www.instagram.com/digitalartsfestival_sia/';
  var PAL = ['var(--slate)', 'var(--slate-200)', 'var(--slate-100)'];   /* 해마다 칠하는 색: 연파랑 명도 단계 */
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)');
  var A = window.anime && !RM.matches ? window.anime : null, root = document.documentElement, introOn = false;   /* A 없으면(불러오기 실패·움직임 줄이기) CSS 만으로 동작 */
  if (A) root.classList.add('anim');
  var app = document.getElementById('app'), hud = document.getElementById('hud');
  var chip = document.getElementById('chip'), clock = document.getElementById('clock'), menu = document.getElementById('menu');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function val(v){ return v ? esc(v) : '<span class="tbd">[자료 필요]</span>'; }
  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function sh(i, label, t){ return '<header class="sh" data-rv><div class="meta caps"><span>' + i + '</span><span>( ' + label + ' )</span></div><h2 class="display"><span class="ln"><span>' + esc(t) + '</span></span></h2></header>'; }
  function theme(e, tag, cls){ return '<' + tag + ' class="display ' + (cls || '') + (e.ko ? ' ko' : '') + '">' + esc(e.theme) + '</' + tag + '>'; }
  function kv(e){ return e.kv ? '<img src="' + esc(e.kv) + '" alt="DIAF ' + e.year + ' 대표 이미지">' : ''; }
  function words(html){ return html.split(' ').map(function(w){ return '<span class="w">' + w + '</span>'; }).join(' '); }
  function qa(i, q, a){ return '<details><summary><span class="caps">Question 0' + i + '</span><span class="q">' + esc(q) + '</span><i aria-hidden="true">+</i></summary><p>' + esc(a) + '</p></details>'; }

  /* 연도를 잇는 선: 앞뒤로 '이전 기록'과 '다음' 점을 둔다 */
  function timeline(){
    var pts = [{ t: 'Earlier', s: '( 자료 수집 중 )' }].concat(EDITIONS.slice().reverse().map(function(e){ return { e: e }; }), [{ t: 'Next', s: '( coming )' }]);
    var n = pts.length, d = 'M0,50', px = 0, py = 50, html = '';
    pts.forEach(function(p, i){
      var x = (i + 0.5) / n * 1000, y = i % 2 ? 72 : 28, mx = (px + x) / 2;
      d += ' C' + mx + ',' + py + ' ' + mx + ',' + y + ' ' + x + ',' + y; px = x; py = y;
      var pos = 'style="left:' + x / 10 + '%;top:' + (100 + y) + 'px;--i:' + i + '"';
      html += p.e
        ? '<a class="pt" href="#/' + p.e.year + '" ' + pos + '><span><b>' + p.e.year + '</b><em class="caps">' + esc(p.e.theme) + '</em><em class="caps muted">' + val(p.e.works) + '</em></span></a>'
        : '<i class="pt hollow" ' + pos + '><span><b>' + p.t + '</b><em class="caps muted">' + p.s + '</em></span></i>';
    });
    d += ' C' + (px + 1000) / 2 + ',' + py + ' ' + (px + 1000) / 2 + ',50 1000,50';
    return '<div class="tl-wrap"><div class="tl" data-rv><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="' + d + '"/></svg>' + html + '</div></div>';
  }

  /* ── 첫 화면 ── */
  function Home(){
    var L = EDITIONS[0], sum = 0, approx = false, genres = {};
    EDITIONS.forEach(function(e){ sum += parseInt(String(e.works || '').replace(/\D/g, ''), 10) || 0; approx = approx || /약/.test(e.works || ''); (e.genres || '').split(', ').forEach(function(g){ if (g) genres[g] = 1; }); });
    var years = EDITIONS[EDITIONS.length - 1].year + '–' + L.year, G = Object.keys(genres);
    app.innerHTML =
      '<section class="hero" id="top" data-label="DIAF"><div class="stage">' +
        '<div class="panel" style="background:' + PAL[0] + '">' + kv(L) +
          '<div class="p-top caps pin"><span>Latest edition</span><span>DIAF ' + L.year + '</span></div>' +
          theme(L, 'h2', 'p-theme pin') +
          '<div class="p-bot pin"><p>' + esc(L.note) + '</p><a class="btn" href="#/' + L.year + '">' + L.year + ' 보기 <i aria-hidden="true">→</i></a></div>' +
        '</div>' +
        '<div class="word"><h1 class="display split" aria-label="DIAF, Digital Arts Festival"><span class="lm" aria-hidden="true"><i style="--k:0">D</i><i style="--k:1">I</i><i style="--k:2">A</i><i style="--k:3">F</i></span></h1></div>' +
        '<div class="fade spread caps" aria-hidden="true"><span>Digital Arts</span><span>Festival</span></div>' +
        '<div class="fade cue caps" aria-hidden="true"><i></i><span>Seoul Institute of the Arts<br>Digital Arts</span></div>' +
        '<svg class="fade ring" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="ringp" d="M50,50 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0"/></defs><text><textPath href="#ringp" textLength="248" lengthAdjust="spacing">DIGITAL ARTS FESTIVAL ✦ SEOUL INSTITUTE OF THE ARTS ✦ </textPath></text><text x="50" y="54" text-anchor="middle" style="font-size:12px">✦</text></svg>' +
      '</div></section>' +
      '<section class="sec" id="about" data-label="About">' + sh('01', 'about', 'Festival') +
        '<div class="stmt-wrap"><span class="caps">( what is diaf )</span><p class="stmt">' +
          words('<mark>DIAF</mark>는 서울예술대학교 디지털아트전공이 해마다 여는 페스티벌입니다. 교수진과 재학생이 한 해 동안 만든 작업을 한 전시장에 모읍니다. 관객은 작품 앞에서 만지고 움직이며 작품을 완성합니다.') +
        '</p></div>' +
        '<div class="stats">' +
          '<div class="rv" data-rv><b class="display"><span class="num" data-n="' + EDITIONS.length + '">' + EDITIONS.length + '</span></b><span class="caps">Editions archived · ' + years + '</span></div>' +
          '<div class="rv" data-rv><b class="display">' + (approx ? '<small class="ko">약 </small>' : '') + '<span class="num" data-n="' + sum + '">' + sum + '</span></b><span class="caps">Works shown · ' + years + '</span></div>' +
          '<div class="rv" data-rv><b class="display"><span class="num" data-n="' + G.length + '">' + G.length + '</span></b><span class="caps">Genres · ' + esc(G.join(' / ')) + '</span></div>' +
        '</div></section>' +
      '<section class="sec" id="editions" data-label="Editions" style="padding-top:0">' + sh('02', EDITIONS.length + ' editions', 'Editions') + timeline() +
        '<div class="ed"><div class="ed-prev" aria-hidden="true">' + EDITIONS.map(function(e, i){
            return '<div class="pv' + (i ? '' : ' on') + '" style="background:' + PAL[i % 3] + '">' + kv(e) + '<span class="caps">DIAF ' + e.year + '</span>' + theme(e, 'b') + '</div>';
          }).join('') + '</div>' +
          '<div class="ed-list">' + EDITIONS.map(function(e, i){
            return '<a class="erow" href="#/' + e.year + '" data-i="' + i + '" style="--c:' + PAL[i % 3] + '"><span class="caps">' + e.year + '</span><h3 class="display t' + (e.ko ? ' ko' : '') + '"><span>' + esc(e.theme) + '</span></h3><span class="go" aria-hidden="true">→</span><span class="m">' + esc(e.note) + '</span></a>';
          }).join('') + '</div></div></section>' +
      '<div class="mq" aria-hidden="true"><div class="track">' + [0, 1].map(function(){
          return '<div class="run">' + EDITIONS.concat(EDITIONS).map(function(e){ return '<b' + (e.ko ? ' class="ko"' : '') + '>' + esc(e.theme) + '</b><s>✦</s>'; }).join('') + '</div>';
        }).join('') + '</div></div>' +
      '<section class="sec inv" id="format" data-label="Format">' + sh('03', 'how it runs', 'Format') +
        '<ol class="fmt">' +
          '<li><span class="caps">01</span><h3 class="display">Exhibition</h3><p class="muted">인스톨레이션과 인터랙티브 작품을 전시장에 설치합니다. 관객이 직접 만지고 움직이며 작품을 완성합니다.</p></li>' +
          '<li><span class="caps">02</span><h3 class="display">Performance</h3><p class="muted">미디어 퍼포먼스와 게임, 애니메이션 상영이 전시 기간 동안 함께 열립니다.</p></li>' +
          '<li><span class="caps">03</span><h3 class="display">Archive</h3><p class="muted">전시가 끝나면 작품과 현장 기록을 웹사이트와 인스타그램, 유튜브에 남깁니다.</p></li>' +
        '</ol></section>' +
      '<section class="sec" id="faq" data-label="FAQ">' + sh('04', 'questions', 'FAQ') +
        '<div class="faq-wrap"><span class="caps">( ask )</span><div class="faq">' +
          qa(1, '언제, 어디서 열리나요?', '해마다 일정과 장소가 다릅니다. 가장 최근인 DIAF ' + L.year + '는 ' + (L.date || '[자료 필요]') + ', ' + (L.venue || '[자료 필요]') + '에서 열렸습니다. 새 소식은 인스타그램에 올라옵니다.') +
          qa(2, '관람료가 있나요?', 'DIAF ' + L.year + '는 ' + (L.admission || '[자료 필요]') + '로 관람할 수 있었습니다. 해마다 공지를 확인해 주세요.') +
          qa(3, '어떤 작품을 볼 수 있나요?', G.join(', ') + '처럼 디지털 매체로 만든 작품을 선보입니다.') +
          qa(4, '지난 페스티벌 기록은 어디서 보나요?', '이 사이트의 Editions 에서 연도별로 주제와 작품을 정리하고 있습니다.') +
        '</div></div></section>' +
      '<section class="sec cta" data-label="Contact"><span class="caps">( stay in touch )</span>' +
        '<a class="blk lime" href="' + IG + '" target="_blank" rel="noopener">Instagram <i aria-hidden="true">↗</i></a>' +
        '<a class="blk slate" href="#/editions">Archive <i aria-hidden="true">→</i></a></section>';
  }

  /* ── 연도 페이지: #/2025 ── */
  function Edition(e){
    var i = EDITIONS.indexOf(e), newer = EDITIONS[i - 1], older = EDITIONS[i + 1], y = String(e.year), works = '';
    for (var k = 1; k <= 6; k++) works += '<figure class="card rv" data-rv><div class="media caps">( work 0' + k + ' )</div><figcaption><span class="caps">0' + k + '</span><b class="display">[작품 제목]</b><span class="muted">[참여 학생]</span></figcaption></figure>';
    app.innerHTML =
      '<section class="ehero" data-label="' + y + '">' +
        '<div class="e3 caps"><a href="#/editions">← Editions</a><span>Digital Arts Festival</span><span>Edition ' + y + '</span></div>' +
        '<div class="ebody"><h1 class="display eyear" aria-label="DIAF ' + y + '">' + y + '</h1>' +
          '<div class="ebot"><span class="caps">( theme )</span>' + theme(e, 'h2', 'etheme') + '<p class="muted">' + esc(e.note) + '</p></div></div>' +
      '</section>' +
      '<section class="sec" data-label="Overview">' + sh('01', 'overview', 'Overview') +
        '<div class="two"><div class="kv" style="background:' + PAL[i % 3] + '">' + kv(e) + '<span class="caps">( key visual )</span>' + theme(e, 'b') + '</div>' +
        '<div><p class="lead">' + esc(e.note) + '</p><dl class="spec">' +
          [['Date', e.date], ['Venue', e.venue], ['Works', e.works], ['People', e.people], ['Genre', e.genres], ['Admission', e.admission]].map(function(r){ return '<div><dt class="caps">' + r[0] + '</dt><dd>' + val(r[1]) + '</dd></div>'; }).join('') +
        '</dl></div></div></section>' +
      '<section class="sec" data-label="Works" style="padding-top:0">' + sh('02', 'works', 'Works') + '<div class="works">' + works + '</div>' +
        '<nav class="pager" aria-label="다른 해">' +
          (older ? '<a href="#/' + older.year + '"><span class="caps">← Previous</span><span class="display">' + older.year + '</span></a>' : '<span></span>') +
          (newer ? '<a href="#/' + newer.year + '"><span class="caps">Next →</span><span class="display">' + newer.year + '</span></a>' : '<span></span>') +
        '</nav></section>';
  }

  /* ── 스크롤: 첫 화면 창 넓히기 · 글자 진해지기 ── */
  var hero, panel, word, fades = [], pins = [], stmt, ws = [], raf = 0, mq = null, lastY = 0, boost = 0, boosting = false;
  function tick(){
    raf = 0;
    var vh = window.innerHeight, rm = RM.matches;
    if (hero && !rm) {
      var r = hero.getBoundingClientRect(), p = clamp(-r.top / (r.height - vh)), q = 1 - Math.pow(1 - clamp(p / 0.8), 3);
      var iy = (1 - q) * 30, ix = (1 - q) * 36;
      panel.style.clipPath = 'inset(' + iy + 'vh ' + ix + 'vw ' + iy + 'vh ' + ix + 'vw round ' + (1 - q) * 14 + 'px)';
      word.style.opacity = 1 - clamp((p - 0.55) / 0.25);
      fades.forEach(function(el){ el.style.opacity = 1 - clamp(p / 0.3); });
      pins.forEach(function(el){ el.style.opacity = clamp((p - 0.7) / 0.2); });
    }
    if (ws.length) {
      var s = stmt.getBoundingClientRect(), n = rm ? ws.length : Math.round(clamp((vh * 0.85 - s.top) / (s.height + vh * 0.3)) * ws.length);
      for (var i = 0; i < ws.length; i++) ws[i].classList.toggle('on', i < n);
    }
    /* 빨강 띠: 스크롤이 빠를수록 빨리 흐르다 천천히 원래 속도로 */
    if (mq) { boost = Math.min(6, Math.max(boost, Math.abs(window.scrollY - lastY) / 10)); if (!boosting) { boosting = true; requestAnimationFrame(decay); } }
    lastY = window.scrollY;
  }
  function decay(){ boost *= 0.93; if (mq) mq.speed = 1 + boost; if (boost > 0.02) requestAnimationFrame(decay); else { boosting = false; if (mq) mq.speed = 1; } }
  function onScroll(){ if (!raf) raf = requestAnimationFrame(tick); }

  /* 화면에 들어오면 .in (제목 줄 올라오기, 선 그리기, 스티커 떨어지기) */
  var hasIO = 'IntersectionObserver' in window;
  var io = hasIO ? new IntersectionObserver(function(es){ es.forEach(function(x){ if (x.isIntersecting) { reveal(x.target); io.unobserve(x.target); } }); }, { rootMargin: '0px 0px -12% 0px' }) : null;
  function reveal(el){
    el.classList.add('in');
    if (!A) return;
    if (el._chars) A.animate(el._chars, { y: ['100%', '0%'], duration: 900, ease: 'out(4)', delay: A.stagger(28) });   /* 제목: 글자마다 아래에서 */
    if (el._draw) {   /* 연도 선: 그려지고 → 점이 차례로 → 연도 숫자가 뒤섞이다 멈춤 */
      A.animate(el._draw, { draw: ['0 0', '0 1'], duration: 1800, ease: 'inOut(3)' });
      A.animate(el.querySelectorAll('.pt'), { opacity: [0, 1], scale: [.4, 1], duration: 700, ease: 'out(4)', delay: A.stagger(130, { start: 400 }) });
      A.animate(el.querySelectorAll('a.pt b'), { innerHTML: A.scrambleText({ chars: 'numbers' }), duration: 900, delay: A.stagger(130, { start: 500 }) });
    }
    el.querySelectorAll('.num').forEach(function(n){ var o = { v: 0 }; A.animate(o, { v: +n.getAttribute('data-n'), duration: 1400, ease: 'out(4)', onUpdate: function(){ n.textContent = Math.round(o.v); } }); });
    if (el.id === 'pile') {   /* 스티커: 화면 위에서 떨어지다가 제자리 근처에서 자석에 끌리듯 빨려 들어가 '착' 붙는다 */
      var chips = [].slice.call(el.children);
      chips.forEach(function(t, i){ var r = parseFloat(t.style.getPropertyValue('--r')); A.utils.set(t, { y: -(t.getBoundingClientRect().bottom + 40), x: ((i * 71) % 240) - 120, rotate: ((i * 37) % 120) - 60, opacity: 1 }); t._r = r; });
      A.animate(chips, {
        y: [{ to: -44, ease: 'in(2)', duration: 560 }, { to: 0, ease: 'in(5)', duration: 150 }],
        x: [{ to: function(t, i){ return (((i * 71) % 240) - 120) * .25; }, ease: 'out(2)', duration: 560 }, { to: 0, ease: 'in(5)', duration: 150 }],
        rotate: [{ to: function(t){ return t._r * 3; }, ease: 'out(2)', duration: 560 }, { to: function(t){ return t._r; }, ease: 'in(5)', duration: 150 }],
        scale: [{ to: 1, duration: 710 }, { to: 1.08, ease: 'out(2)', duration: 60 }, { to: 1, ease: 'out(4)', duration: 280 }],
        delay: A.stagger(80, { from: 'random' })
      });
    }
  }
  /* 화면 가운데 줄에 걸린 구역 이름을 칩에 */
  var so = hasIO ? new IntersectionObserver(function(es){ es.forEach(function(x){ if (x.isIntersecting) chip.textContent = x.target.getAttribute('data-label'); }); }, { rootMargin: '-50% 0px -50% 0px' }) : null;
  if (hasIO) new IntersectionObserver(function(es){ hud.classList.toggle('off', es[0].isIntersecting); }).observe(document.getElementById('ftr'));

  function init(){
    if (so) so.disconnect();
    if (A) {
      app.querySelectorAll('.sh .ln>span').forEach(function(s){ var h = s.closest('.sh'); h._chars = A.splitText(s, { words: false, chars: { wrap: 'clip' } }).chars; A.utils.set(h._chars, { y: '100%' }); });
      var tlEl = app.querySelector('.tl');
      if (tlEl) { tlEl._draw = A.svg.createDrawable(tlEl.querySelector('path')); A.utils.set(tlEl._draw, { draw: '0 0' }); A.utils.set(tlEl.querySelectorAll('.pt'), { opacity: 0, scale: .4 }); }
      app.querySelectorAll('.num').forEach(function(n){ n.textContent = '0'; });
      if (mq) mq.pause();
      var track = app.querySelector('.mq .track'); mq = track ? A.animate(track, { x: ['0%', '-50%'], duration: 25000, ease: 'linear', loop: true }) : null;
      var ey = app.querySelector('.eyear'); if (ey) A.animate(ey, { innerHTML: A.scrambleText({ chars: 'numbers' }), duration: 1000, delay: introOn ? 1900 : 150 });
    }
    document.querySelectorAll('[data-rv]:not(.in)').forEach(function(el){ if (io) io.observe(el); else reveal(el); });
    app.querySelectorAll('[data-label]').forEach(function(el){ if (so) so.observe(el); });
    hero = app.querySelector('.hero'); panel = hero && hero.querySelector('.panel'); word = hero && hero.querySelector('.word');
    fades = hero ? [].slice.call(hero.querySelectorAll('.fade')) : []; pins = hero ? [].slice.call(hero.querySelectorAll('.pin')) : [];
    stmt = app.querySelector('.stmt'); ws = stmt ? stmt.querySelectorAll('.w') : [];
    /* 연도 목록에 올리면 미리보기 교체: anime 있으면 새 카드가 아래에서 닦이듯 올라온다 */
    var pvs = [].slice.call(app.querySelectorAll('.pv')), cur = 0;
    if (A) pvs.forEach(function(p, i){ A.utils.set(p, { clipPath: i ? 'inset(100% 0% 0% 0%)' : 'inset(0% 0% 0% 0%)' }); });
    app.querySelectorAll('.erow[data-i]').forEach(function(row){
      function on(){
        var i = +row.getAttribute('data-i'), nx = pvs[i]; if (!nx || i === cur) return;
        pvs.forEach(function(p, k){ p.classList.toggle('on', k === i); p.style.zIndex = k === i ? 2 : k === cur ? 1 : 0; });
        if (A) {
          A.animate(nx, { clipPath: ['inset(100% 0% 0% 0%)', 'inset(0% 0% 0% 0%)'], duration: 700, ease: 'out(4)', onComplete: function(){ pvs.forEach(function(p){ if (p !== pvs[cur]) A.utils.set(p, { clipPath: 'inset(100% 0% 0% 0%)' }); }); } });
          A.animate(nx.querySelector('.display'), { y: ['40%', '0%'], duration: 800, ease: 'out(4)' });
        }
        cur = i;
      }
      row.addEventListener('mouseenter', on); row.addEventListener('focus', on);
    });
    tick();
  }

  /* ── 주소: #/ 첫 화면, #/about·#/editions·#/format·#/faq 그 챕터, #/2025 연도 페이지 ── */
  function route(){
    var h = location.hash.replace(/^#\/?/, ''), e = EDITIONS.filter(function(x){ return String(x.year) === h; })[0];
    if (menu.open) menu.close();
    if (e) { Edition(e); window.scrollTo(0, 0); document.title = 'DIAF ' + e.year + ' · ' + e.theme; }
    else { Home(); document.title = 'DIAF · Digital Arts Festival'; var t = h && document.getElementById(h); if (t) t.scrollIntoView(); else window.scrollTo(0, 0); }
    document.querySelectorAll('.hdr .roll').forEach(function(a){ a.classList.toggle('is-on', a.getAttribute('href') === '#/' + h); });
    init();
  }

  /* 푸터 스티커: 테마·연도를 벽에 붙인 듯 줄지어 둔다 (각도는 고정값이라 매번 같다) */
  var stickers = ['DIAF'].concat(EDITIONS.map(function(e){ return e.theme; }), EDITIONS.map(function(e){ return String(e.year); }), ['Seoul', '✦', 'Digital Arts', 'Festival', '✦']);
  document.getElementById('pile').innerHTML = stickers.map(function(t, i){
    return '<span class="' + ['lime', 'slate', 'ink', 'paper'][i % 4] + '" style="--r:' + ((i * 53) % 17 - 8) + 'deg;--d:' + i * 70 + 'ms">' + esc(t) + '</span>';
  }).join('');

  /* 서울 시각 */
  var fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  function tickClock(){ clock.textContent = 'Seoul ' + fmt.format(new Date()); }
  tickClock(); setInterval(tickClock, 1000);

  document.querySelector('.menu-btn').addEventListener('click', function(){ menu.showModal(); });
  menu.addEventListener('click', function(ev){ if (ev.target.closest('a,[data-close]')) menu.close(); });
  document.querySelector('[data-top]').addEventListener('click', function(ev){ ev.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  window.addEventListener('hashchange', route);
  if (A) A.utils.set([].slice.call(document.getElementById('pile').children), { opacity: 0 });   /* 스티커는 떨어지기 전까지 숨김 */

  /* ── 입장: 'DIGITAL ARTS FESTIVAL' 글자 안에 액체가 차오른다.
     수면은 스프링 물결 시뮬레이션(붓는 자리 출렁임 + 기포), 차오르는 양·순서는 anime.js 타임라인. 첫 로드에만. ── */
  var loader = document.getElementById('loader');
  function liquidIntro(){
    var hdr = document.getElementById('hdr'), heroEl = app.querySelector('.hero');
    var letters = heroEl ? heroEl.querySelectorAll('.lm i') : [], panelEl = heroEl && heroEl.querySelector('.panel');
    introOn = true; root.classList.add('intro', 'lock');
    A.utils.set(hdr, { y: '-100%' }); A.utils.set(hud, { opacity: 0 });
    if (heroEl) { A.utils.set(fades, { opacity: 0 }); A.utils.set(letters, { clipPath: 'inset(100% 0% 0% 0%)' }); A.utils.set(panelEl, { y: '70vh' }); }
    var fontReady = document.fonts && document.fonts.load ? document.fonts.load('800 100px Archivo') : Promise.resolve();
    Promise.race([fontReady, new Promise(function(r){ setTimeout(r, 2500); })]).then(start, start);

    function start(){
      var cv = document.getElementById('ldcv'), ctx = cv.getContext('2d'), W = innerWidth, H = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      var css = getComputedStyle(root), COL = ['--slate', '--slate-200', '--lime'].map(function(v){ return css.getPropertyValue(v).trim(); });
      var ldc = document.getElementById('ldc'), bar = document.getElementById('ldbar');
      function canvas(){ var c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr; var x = c.getContext('2d'); x.scale(dpr, dpr); return x; }
      function setFont(c, fs){ c.font = '800 ' + fs + 'px Archivo, "Noto Sans KR", sans-serif'; if ('fontStretch' in c) c.fontStretch = 'expanded'; }
      cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

      /* 줄 배치: 'DIGITAL ARTS FESTIVAL' 한 줄을 화면 가운데에 (좁은 화면은 DIGITAL ARTS / FESTIVAL 두 줄) */
      var maxW = W * (W < 768 ? 0.92 : 0.94), rows = [];
      function wid(t, fs){ setFont(ctx, fs); return ctx.measureText(t).width; }
      function fit(t, cap){ return Math.min(cap, 100 * maxW / wid(t, 100)); }
      var mainT = ['DIGITAL ARTS FESTIVAL'], mfs = fit(mainT[0], H * 0.24);
      if (mfs < (W < 768 ? 44 : 60)) { mainT = ['DIGITAL ARTS', 'FESTIVAL']; mfs = fit('DIGITAL ARTS', H * 0.18); }
      mainT.forEach(function(t){ rows.push({ t: t, k: 2, fs: mfs, dur: 900 }); });
      rows.forEach(function(r){ setFont(ctx, r.fs); var m = ctx.measureText(r.t); r.w = m.width; r.cap = m.actualBoundingBoxAscent || r.fs * .72; r.x0 = (W - r.w) / 2; });
      var mh = rows.reduce(function(a, r, i){ return a + r.cap + (i ? r.cap * .28 : 0); }, 0), y = (H - mh) / 2;
      rows.forEach(function(r, i){ if (i) y += r.cap * .28; y += r.cap; r.base = y; });
      rows.forEach(function(r, i){
        var n = Math.max(12, Math.round(r.w / 6));
        r.h = new Float32Array(n + 1); r.v = new Float32Array(n + 1); r.ld = new Float32Array(n + 1); r.rd = new Float32Array(n + 1);
        r.lv = { v: 0 }; r.pour = .2 + (i * .29) % .6; r.bub = []; r.col = COL[r.k];
      });
      /* 글자 모양(가리개)과 윤곽선은 한 번만 그려 둔다 */
      var mk = canvas(), ol = canvas();
      rows.forEach(function(r){ setFont(mk, r.fs); setFont(ol, r.fs); mk.textAlign = ol.textAlign = 'left'; mk.fillText(r.t, r.x0, r.base); ol.lineWidth = 1; ol.strokeStyle = '#000'; ol.strokeText(r.t, r.x0, r.base); });

      var oa = { v: 0 }, alive = true, last = performance.now();
      function sim(r){
        var n = r.h.length - 1, i, L = r.lv.v;
        if (L > 0 && L < 1) {   /* 붓는 자리 출렁임 + 기포 */
          r.v[Math.round(r.pour * n)] += (Math.random() - .35) * 1.6;
          if (Math.random() < .3) r.bub.push({ x: r.x0 + Math.random() * r.w, y: r.base, s: 1 + Math.random() * 2.2, ph: Math.random() * 6 });
        }
        for (i = 0; i <= n; i++) { r.v[i] += -.02 * r.h[i] - .03 * r.v[i]; r.h[i] = Math.max(-r.cap * .3, Math.min(r.cap * .3, r.h[i] + r.v[i])); }
        for (var pass = 0; pass < 2; pass++) {
          for (i = 0; i <= n; i++) { r.ld[i] = i > 0 ? .2 * (r.h[i] - r.h[i - 1]) : 0; r.rd[i] = i < n ? .2 * (r.h[i] - r.h[i + 1]) : 0; if (i > 0) r.v[i - 1] += r.ld[i]; if (i < n) r.v[i + 1] += r.rd[i]; }
          for (i = 0; i <= n; i++) { if (i > 0) r.h[i - 1] += r.ld[i]; if (i < n) r.h[i + 1] += r.rd[i]; }
        }
      }
      function frame(now){
        if (!alive) return;
        var steps = Math.max(1, Math.min(3, Math.round((now - last) / 16.7))); last = now;
        ctx.clearRect(0, 0, W, H);
        var sum = 0;
        rows.forEach(function(r){
          for (var k = 0; k < steps; k++) sim(r);
          var L = r.lv.v, n = r.h.length - 1, amp = 5 * (1 - L) * Math.min(1, L * 6) + .6, sy = r.base + 2 - L * (r.cap + 8);
          sum += L;
          if (L <= 0) return;
          ctx.fillStyle = r.col; ctx.beginPath(); ctx.moveTo(r.x0 - 4, r.base + 6);
          for (var i = 0; i <= n; i++) { var x = r.x0 - 4 + i / n * (r.w + 8); ctx.lineTo(x, sy + r.h[i] + amp * (Math.sin(x * .018 + now * .0032 + r.k) * .6 + Math.sin(x * .047 - now * .0021) * .4)); }
          ctx.lineTo(r.x0 + r.w + 4, r.base + 6); ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.55)';
          r.bub = r.bub.filter(function(b){ b.y -= .7 + b.s * .25; b.x += Math.sin(now * .006 + b.ph) * .3; if (b.y < sy + 3) return false; ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, 6.283); ctx.fill(); return true; });
        });
        ctx.globalCompositeOperation = 'destination-in'; ctx.drawImage(mk.canvas, 0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = oa.v; ctx.drawImage(ol.canvas, 0, 0, W, H); ctx.globalAlpha = 1;
        var avg = sum / rows.length; ldc.textContent = ('00' + Math.round(avg * 100)).slice(-3); bar.style.transform = 'scaleX(' + avg + ')';
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      var fillEnd = 0; rows.forEach(function(r, i){ r.at = 150 + i * 170; fillEnd = Math.max(fillEnd, r.at + r.dur); });
      var out = fillEnd + 150;
      var tl = A.createTimeline({ defaults: { ease: 'out(4)' }, onComplete: done });
      tl.add(oa, { v: 1, duration: 350, ease: 'out(2)' }, 0);
      rows.forEach(function(r){ tl.add(r.lv, { v: 1, duration: r.dur, ease: 'inOut(2)' }, r.at); });
      tl.add(loader, { y: ['0%', '-100%'], duration: 650, ease: 'inOut(3)' }, out);
      if (heroEl) {
        tl.add(panelEl, { y: ['70vh', '0vh'], duration: 900 }, out + 100)
          .add(letters, { clipPath: ['inset(100% 0% 0% 0%)', 'inset(0% 0% 0% 0%)'], duration: 500, ease: A.steps(6), delay: A.stagger(80) }, out + 250)
          .add(fades, { opacity: [0, 1], duration: 600, delay: A.stagger(60) }, out + 500);
      }
      tl.add(hdr, { y: ['-100%', '0%'], duration: 700 }, out + 300)
        .add(hud, { opacity: [0, 1], duration: 500 }, out + 750);
      setTimeout(function(){ root.classList.remove('lock'); }, out + 400);
      function done(){ alive = false; introOn = false; root.classList.remove('intro', 'lock'); loader.remove(); }
    }
  }
  route();
  if (A) liquidIntro(); else { root.classList.remove('intro', 'lock'); loader.remove(); }
})();
</script>
